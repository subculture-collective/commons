name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Homelab deploy keys accept only Kvant's address (Kvant and its Kuznya VM); the kvant label keeps this job off Buran.
    runs-on: [ubuntu-latest, kvant]
    timeout-minutes: 30
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run check:seo
      - run: npm audit --omit=dev
      - name: Build and qualify the accepted application image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          image="fleet-deploy/commons/app:$DEPLOY_REVISION"
          docker build --build-arg "SOURCE_REVISION=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/commons" \
            -t "$image" .
          bash scripts/check-ci-image.sh "$image" "$DEPLOY_REVISION"
