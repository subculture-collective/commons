name: Deploy
run-name: Deploy ${{ github.sha }}

# Deploys main to NUC. The job joins the tailnet as tag:github-ci (Tailscale
# OAuth client in the TS_OAUTH_* organization secrets), then uses this
# repository's deploy key, which NUC accepts only from tailnet addresses and
# only for the commons fleet-deploy receiver.
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a run that may be mid-deployment.
  cancel-in-progress: false

env:
  TARGET: onnwee@100.93.201.83
  DEPLOY_REVISION: ${{ github.sha }}

jobs:
  deploy:
    name: Build application and deploy NUC
    if: github.repository == 'subculture-collective/commons' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-ci
          version: latest
          # The tailnet DNS server (10.0.0.200) is unreachable from hosted runners.
          args: --accept-dns=false
      - name: Prepare the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
      - name: Reuse an already accepted application artifact
        id: artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          d="$RUNNER_TEMP/deploy"
          ssh_args=(-F /dev/null -i "$d/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=15 "$TARGET")
          # The receiver deploys only Gitea's current main. Kvant copies GitHub
          # to Gitea every minute, so wait while the revision has not arrived.
          for attempt in $(seq 1 20); do
            # shellcheck disable=SC2029
            if ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION app" > "$d/artifact.json" 2> "$d/err"; then break; fi
            if grep -q "no longer the current main" "$d/err" && [ "$attempt" -lt 20 ]; then
              echo "Gitea has not received $DEPLOY_REVISION yet; waiting 30 s ($attempt/20)"; sleep 30; continue
            fi
            cat "$d/err" >&2; exit 1
          done
          python3 - "$d/artifact.json" "$GITHUB_OUTPUT" <<'PYCODE'
          import json, re, sys
          from pathlib import Path
          info = json.loads(Path(sys.argv[1]).read_text())
          available = info.get("available") is True
          if available:
              assert re.fullmatch(r"[0-9a-f]{64}", info.get("html_sha256", ""))
          with Path(sys.argv[2]).open("a") as output:
              output.write("available=" + str(available).lower() + "\n")
          PYCODE
      - name: Build and qualify the accepted application image
        if: steps.artifact.outputs.available != 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          image="fleet-deploy/commons/app:$DEPLOY_REVISION"
          # The fleet-deploy receiver identifies the application by this Gitea source label.
          docker build --build-arg "SOURCE_REVISION=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/commons" \
            -t "$image" .
          bash scripts/check-ci-image.sh "$image" "$DEPLOY_REVISION"
      - name: Deploy with backup qualification and verify the public build
        env:
          REUSE_ARTIFACT: ${{ steps.artifact.outputs.available }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          d="$RUNNER_TEMP/deploy"
          ssh_args=(-F /dev/null -i "$d/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=15 "$TARGET")
          ssh "${ssh_args[@]}" status
          image="fleet-deploy/commons/app:$DEPLOY_REVISION"
          if [[ "$REUSE_ARTIFACT" != true ]]; then
            # shellcheck disable=SC2029
            docker save "$image" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION app"
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 \
            -D "$d/headers" https://commons.subcult.tv/build-info.json > "$d/build-info.json"
          python3 - "$d/build-info.json" "$d/headers" "$DEPLOY_REVISION" <<'PYCODE'
          import json, sys
          from pathlib import Path
          expected = {"schema_version": 1, "source_commit": sys.argv[3]}
          assert Path(sys.argv[1]).read_bytes() == (json.dumps(expected, separators=(",", ":")) + "\n").encode()
          assert any(line.lower().startswith("cache-control:") and "no-store" in line.lower() for line in Path(sys.argv[2]).read_text().splitlines())
          PYCODE
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 \
            https://commons.subcult.tv/favicon.ico > "$d/favicon.ico"
          cmp public/favicon.ico "$d/favicon.ico"
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 \
            https://commons.subcult.tv/api/health > "$d/health.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["ok"] is True' "$d/health.json"
          printf 'Live Commons build marker, health and favicon match source %s\n' "$DEPLOY_REVISION"
      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
